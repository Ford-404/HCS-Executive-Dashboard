name: Weekly executive report

on:
  schedule:
    # Mondays 12:17 UTC = 6:17 AM CST / 7:17 AM CDT. GitHub cron is UTC-only.
    - cron: "17 12 * * 1"
  workflow_dispatch:        # "Run workflow" button for manual sends / testing
    inputs:
      send_email:
        description: "Send the email (uncheck to only build the PDF)"
        type: boolean
        default: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt
      - run: pytest -q

      # Keep last week's snapshot so the email can show what changed.
      - uses: actions/cache/restore@v4
        with:
          path: out/snapshots
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-

      - name: Build and send report
        env:
          PROCORE_CLIENT_ID: ${{ secrets.PROCORE_CLIENT_ID }}
          PROCORE_CLIENT_SECRET: ${{ secrets.PROCORE_CLIENT_SECRET }}
          PROCORE_COMPANY_ID: ${{ secrets.PROCORE_COMPANY_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" != "true" ]; then
            python -m report --no-email
          else
            python -m report
          fi

      - uses: actions/cache/save@v4
        if: success()
        with:
          path: out/snapshots
          key: snapshots-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.run_number }}
          path: out/*.pdf
          retention-days: 90
